version: "3.9"

services:
  llama-swap-priority:
    container_name: llama-swap-priority
    build:
      context: ./
      dockerfile_inline: |
        FROM python:3.12-slim
         RUN apt-get update && apt-get install -y curl \
            && rm -rf /var/lib/apt/lists/* \
            && curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc \
            && chmod a+r /etc/apt/keyrings/docker.asc \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
                https://download.docker.com/linux/debian \
                $(. /etc/os-release && grep VERSION_CODENAME /etc/os-release | cut -d'=' -f2) stable" \
                > /etc/apt/sources.list.d/docker.list \
            && apt-get update \
            && apt-get install -y docker-ce-cli \
            && rm -rf /var/lib/apt/lists/*
         RUN pip install --no-cache-dir setuptools>=68
         WORKDIR /app
         COPY llama_swap/ /app/llama_swap/
         COPY pyproject.toml /app/pyproject.toml
         RUN pip install --no-cache-dir .
         ENTRYPOINT ["python", "-m", "llama_swap"]
    image: local/llama-swap-priority:latest
    network_mode: host
    env_file: ${ENV_FILE:-./stack.env}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PRESETS_PATH:-./presets.ini}:/app/presets.ini:ro
      - ${MODELS_PATH:-./models/}:/app/models/:ro
      - /tmp:/tmp
